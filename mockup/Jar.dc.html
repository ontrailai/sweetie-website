<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sweet Bee jar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="{{ariaLabel}}" style="position: relative; width: 100%; aspect-ratio: 10 / 31; container-type: inline-size; font-family: 'Instrument Serif', serif; color: #262626;">

<div style="position: absolute; left: 4%; right: 4%; bottom: -2.2%; height: 3.4%; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(38,38,38,0.42) 0%, rgba(38,38,38,0.16) 45%, rgba(38,38,38,0) 72%);"></div>

<div style="position: absolute; top: 0; left: 3%; right: 3%; height: 7.2%; border-radius: 3cqw 3cqw 1.6cqw 1.6cqw; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.07) 0 1px, rgba(0,0,0,0) 1px 3px), linear-gradient(90deg, #0e0e0e 0%, #343434 14%, #5a5a5a 23%, #2b2b2b 40%, #1c1c1c 70%, #3e3e3e 86%, #0e0e0e 100%); box-shadow: inset 0 1.2cqw 1cqw rgba(255,255,255,0.1), inset 0 -0.8cqw 0.8cqw rgba(0,0,0,0.5);"></div>

<div style="position: absolute; top: 7.2%; left: 6%; right: 6%; height: 1.8%; background: linear-gradient(90deg, rgba(120,110,100,0.35), rgba(255,255,255,0.45) 22%, rgba(255,255,255,0.15) 55%, rgba(120,110,100,0.4)); border-left: 1px solid rgba(38,38,38,0.18); border-right: 1px solid rgba(38,38,38,0.18);"></div>

<div style="position: absolute; top: 9%; left: 0; right: 0; bottom: 0; border-radius: 7cqw 7cqw 9cqw 9cqw / 2.6cqw 2.6cqw 3.6cqw 3.6cqw; overflow: hidden; background: linear-gradient(90deg, rgba(200,190,175,0.55) 0%, rgba(255,255,255,0.28) 14%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.22) 86%, rgba(200,190,175,0.6) 100%); box-shadow: inset 0 0 0 1px rgba(38,38,38,0.16);">

<div style="position: absolute; top: 4.5%; bottom: 3.6%; left: 2.2%; right: 2.2%; border-radius: 5cqw 5cqw 7cqw 7cqw / 1.4cqw 1.4cqw 3cqw 3cqw; background: {{honeyBg}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), inset 0 2cqw 2.4cqw rgba(255,255,255,0.18); overflow: hidden;">
<sc-for list="{{specks}}" as="s" hint-placeholder-count="0">
<span style="{{s.style}}"></span>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 3.8%; background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.55)); border-top: 1px solid rgba(255,255,255,0.35);"></div>

<div style="position: absolute; top: 27%; height: 50%; left: 0; right: 0; background: {{labelColor}}; border-top: {{labelEdge}}; border-bottom: {{labelEdge}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6cqw; padding: 0 9%; box-sizing: border-box; text-align: center; color: {{labelText}};">
<img src="{{logoSrc}}" alt="" style="width: 78%; height: auto; display: block; margin-bottom: 3cqw;">
<span style="font-style: italic; font-size: 17cqw; line-height: 0.9; letter-spacing: 0.025em;">No. {{num}}</span>
<span style="font-size: 7.4cqw; line-height: 1.15; letter-spacing: 0.2em; text-transform: uppercase;">{{jarName}}</span>
<span style="width: 22%; height: 1px; background: {{labelText}}; opacity: 0.6; margin: 1.2cqw 0;"></span>
<span style="font-family: 'Courier Prime', monospace; font-size: 4.8cqw; line-height: 1.35; letter-spacing: 0.06em;">{{descriptor}}</span>
<span style="font-family: 'Courier Prime', monospace; font-size: 4cqw; letter-spacing: 0.12em; opacity: 0.85; margin-top: 2cqw;">SAN DIEGO COUNTY</span>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(21, minmax(0, 1fr)); grid-template-rows: repeat(21, minmax(0, 1fr)); width: 26%; aspect-ratio: 1 / 1; margin-top: 2.6cqw; padding: 1.4cqw; box-sizing: content-box; background: #F6EDDD; border-radius: 0.6cqw;">
<sc-for list="{{qr}}" as="q" hint-placeholder-count="0"><span style="{{q.style}}"></span></sc-for>
</div>
<span style="font-family: 'Courier Prime', monospace; font-size: 3.4cqw; letter-spacing: 0.1em; opacity: 0.85;">SCAN FOR BATCH</span>
<div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0.34) 0%, rgba(0,0,0,0.08) 16%, rgba(255,255,255,0.1) 30%, rgba(255,255,255,0) 46%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.14) 86%, rgba(0,0,0,0.4) 100%); pointer-events: none;"></div>
</div>

<div style="position: absolute; top: 2%; bottom: 6%; left: 11%; width: 8%; border-radius: 4cqw; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 45%, rgba(255,255,255,0.15) 70%, rgba(255,255,255,0) 100%);"></div>
<div style="position: absolute; top: 3%; bottom: 8%; right: 8%; width: 2.6%; border-radius: 2cqw; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.42), rgba(255,255,255,0));"></div>
<div style="position: absolute; top: 3.4%; left: 18%; right: 18%; height: 1.2%; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,255,255,0.5), rgba(255,255,255,0) 70%);"></div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"num":{"editor":"text","default":"01"},"jarName":{"editor":"text","default":"Wildflower"},"descriptor":{"editor":"text","default":"Raw wildflower honey"},"labelColor":{"editor":"color","default":"#FF007C","options":["#FF007C","#308F32","#F6EDDD","#262626","#004832","#FF0000"]},"labelText":{"editor":"color","default":"#F6EDDD","options":["#F6EDDD","#262626"]},"honey":{"editor":"color","default":"#D9921E"},"honeyDark":{"editor":"color","default":"#7E4006"},"flecks":{"editor":"enum","default":"none","options":["none","vanilla","cinnamon","pollen","salt"]},"$preview":{"width":200,"height":620}}'>
class Component extends DCLogic {
  mix(hex, to, amt) {
    var h = String(hex || '#D9921E').replace('#', '');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var t = to.replace('#', '');
    var out = '#';
    for (var i = 0; i < 3; i++) {
      var a = parseInt(h.substr(i*2, 2), 16), b = parseInt(t.substr(i*2, 2), 16);
      var v = Math.round(a + (b - a) * amt);
      out += ('0' + v.toString(16)).slice(-2);
    }
    return out;
  }
  renderVals() {
    var p = this.props;
    var honey = p.honey ?? '#D9921E';
    var dark = p.honeyDark ?? '#7E4006';
    var light = this.mix(honey, '#FFF4C8', 0.42);
    var mid = this.mix(honey, dark, 0.35);
    var kinds = {
      vanilla: { n: 70, colors: ['rgba(28,14,6,0.85)', 'rgba(45,22,8,0.7)'], min: 0.35, max: 0.9, round: false },
      cinnamon: { n: 55, colors: ['rgba(96,40,10,0.6)', 'rgba(130,60,18,0.5)'], min: 0.5, max: 1.4, round: false },
      pollen: { n: 34, colors: ['rgba(255,178,36,0.95)', 'rgba(236,128,18,0.9)', 'rgba(255,205,80,0.9)'], min: 1.1, max: 2.2, round: true },
      salt: { n: 30, colors: ['rgba(255,255,255,0.8)', 'rgba(255,255,255,0.55)'], min: 0.5, max: 1.1, round: false }
    };
    var k = kinds[p.flecks];
    var specks = [];
    if (k) {
      var seed = 7 + parseInt(String(p.num ?? '1'), 10) * 131;
      var rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
      for (var i = 0; i < k.n; i++) {
        var w = k.min + rnd() * (k.max - k.min);
        var h = k.round ? w * (0.8 + rnd() * 0.3) : w * (0.35 + rnd() * 0.5);
        specks.push({ style: 'position: absolute; left: ' + (3 + rnd() * 92).toFixed(1) + '%; top: ' + (2 + rnd() * 95).toFixed(1) + '%; width: ' + w.toFixed(2) + 'cqw; height: ' + h.toFixed(2) + 'cqw; border-radius: 50%; transform: rotate(' + Math.round(rnd() * 180) + 'deg); background: ' + k.colors[Math.floor(rnd() * k.colors.length)] + '; opacity: ' + (0.55 + rnd() * 0.45).toFixed(2) + ';' });
      }
    }
    var qseed = 3 + parseInt(String(p.num ?? '1'), 10) * 977;
    var qrnd = function () { qseed = (qseed * 9301 + 49297) % 233280; return qseed / 233280; };
    var finder = function (r, c, r0, c0) {
      var y = r - r0, x = c - c0;
      if (y < 0 || x < 0 || y > 7 || x > 7) return null;
      if (y === 7 || x === 7) return false;
      if (y === 0 || y === 6 || x === 0 || x === 6) return true;
      return y >= 2 && y <= 4 && x >= 2 && x <= 4;
    };
    var qr = [];
    for (var r = 0; r < 21; r++) {
      for (var c = 0; c < 21; c++) {
        var on = finder(r, c, 0, 0);
        if (on === null) on = finder(r, c, 0, 13) === null ? null : finder(r, 20 - c, 0, 0);
        if (on === null) on = finder(r, c, 13, 0) === null ? null : finder(20 - r, c, 0, 0);
        if (on === null && r === 6) on = c % 2 === 0;
        if (on === null && c === 6) on = r % 2 === 0;
        if (on === null) on = qrnd() < 0.48;
        qr.push({ style: on ? 'background: #262626;' : 'background: transparent;' });
      }
    }
    var honeyBg = 'linear-gradient(90deg, ' + dark + ' 0%, ' + mid + ' 12%, ' + honey + ' 24%, ' + light + ' 36%, ' + honey + ' 52%, ' + mid + ' 80%, ' + dark + ' 100%)';
    var labelColor = p.labelColor ?? '#FF007C';
    var labelText = p.labelText ?? '#F6EDDD';
    var isLight = String(labelText).toUpperCase() === '#262626';
    var jarName = p.jarName ?? 'Wildflower';
    var num = p.num ?? '01';
    return {
      num: num,
      jarName: jarName,
      descriptor: p.descriptor ?? 'Raw wildflower honey',
      labelColor: labelColor,
      labelText: labelText,
      labelEdge: isLight ? '1px solid rgba(38,38,38,0.35)' : '0 solid transparent',
      logoSrc: isLight ? '/_blob/9cdda06d00c7ef1339d4d87264f6e2d9' : '/_blob/17148661246ca395e011b75752095c19',
      honeyBg: honeyBg,
      specks: specks,
      qr: qr,
      ariaLabel: 'Sweet Bee jar No. ' + num + ', ' + jarName
    };
  }
}
</script>
</body>
</html>
